[project]
name = "bambu-rfid-writer"
version = "0.9.3"
description = "Desktop workflows for Bambu MIFARE Classic and NFC Type 2 tags through Proxmark3"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["bambu_rfid_diag"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
